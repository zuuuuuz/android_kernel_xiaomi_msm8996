name: Build NetHunter Kernel (lithium + AR9271)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Patch mac80211 for Packet Injection
        run: |
          # Разрешаем инъекцию пакетов в режиме мониторинга на любых каналах (аналог mac80211.patch)
          if [ -f net/mac80211/tx.c ]; then
            sed -i 's/if (unlikely(info->flags & IEEE80211_TX_CTL_INJECTED))/if (false)/g' net/mac80211/tx.c || true
          fi

      - name: Configure & Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out
          make O=out lineageos_lithium_defconfig || make O=out gemini_defconfig

          ./scripts/config --file out/.config \
            -e MAC80211 \
            -e MAC80211_MESH \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e WLAN \
            -e ATH_CARDS \
            -e ATH9K_HTC \
            -e FW_LOADER \
            -e USB_HID \
            -e HID_GENERIC \
            -e USB_CONFIGFS_F_HID

          make O=out olddefconfig
          make -j$(nproc) O=out

      - name: Package AnyKernel3 Zip
        run: |
          git clone https://github.com --depth=1 ~/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb ~/AnyKernel3/
          sed -i 's/device.name1=.*/device.name1=lithium/' ~/AnyKernel3/anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot;/' ~/AnyKernel3/anykernel.sh
          cd ~/AnyKernel3 && zip -r9 ~/NetHunter-Kernel-lithium-AR9271.zip * -x .git README.md *placeholder

      - name: Upload Ready Kernel
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-lithium-AR9271
          path: ~/NetHunter-Kernel-lithium-AR9271.zip
