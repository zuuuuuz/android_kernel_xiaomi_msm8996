name: Build NetHunter Kernel (lithium + AR9271 + GCC 4.9)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3
          fetch-depth: 1

      - name: Checkout GCC 4.9 Toolchains
        uses: actions/checkout@v4
        with:
          repository: KudProject/arm64-gcc
          path: gcc64
          fetch-depth: 1

      - name: Checkout GCC 4.9 ARM32
        uses: actions/checkout@v4
        with:
          repository: KudProject/arm-gcc
          path: gcc32
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2

      - name: Patch mac80211 for Packet Injection
        run: |
          if [ -f net/mac80211/tx.c ]; then
            sed -i 's/if (unlikely(info->flags & IEEE80211_TX_CTL_INJECTED))/if (false)/g' net/mac80211/tx.c || true
          fi

      - name: Configure & Compile Kernel with GCC 4.9
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$PWD/gcc64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$PWD/gcc32/bin/arm-linux-androideabi-

          mkdir -p out
          DEFCONFIG=$(ls arch/arm64/configs/*lithium* | head -n 1 | xargs basename)
          make O=out "$DEFCONFIG"

          ./scripts/config --file out/.config \
            -e MAC80211 \
            -e MAC80211_MESH \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e WLAN \
            -e ATH_CARDS \
            -e ATH9K_HTC \
            -e FW_LOADER \
            -e USB_HID \
            -e HID_GENERIC \
            -e USB_CONFIGFS_F_HID

          make O=out olddefconfig
          make -j$(nproc) O=out

      - name: Pack Flashable Zip
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/ramdisk AnyKernel3/patch AnyKernel3/modules
          sed -i 's/device.name1=.*/device.name1=lithium/' AnyKernel3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/platform/soc/624000.ufshc/by-name/boot;|' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../NetHunter-Kernel-lithium-GCC49.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-lithium-GCC49
          path: NetHunter-Kernel-lithium-GCC49.zip
