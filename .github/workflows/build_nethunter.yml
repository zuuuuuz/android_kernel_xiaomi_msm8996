name: Build NetHunter Kernel (lithium + AR9271)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix GCC 11 Compatibility & Patch mac80211
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
          if [ -f net/mac80211/tx.c ]; then
            sed -i 's/if (unlikely(info->flags & IEEE80211_TX_CTL_INJECTED))/if (false)/g' net/mac80211/tx.c || true
          fi

      - name: Configure & Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          mkdir -p out
          make O=out lineageos_lithium_defconfig || make O=out gemini_defconfig

          ./scripts/config --file out/.config \
            -e MAC80211 \
            -e MAC80211_MESH \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e WLAN \
            -e ATH_CARDS \
            -e ATH9K_HTC \
            -e FW_LOADER \
            -e USB_HID \
            -e HID_GENERIC \
            -e USB_CONFIGFS_F_HID

          make O=out olddefconfig
          make -j$(nproc) O=out KCFLAGS="-Wno-error -fcommon" HOSTCFLAGS="-fcommon"

      - name: Upload Ready Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-dtb-lithium
          path: out/arch/arm64/boot/Image.gz-dtb
